services:
  postgres:
    image: postgres:17
    container_name: heurislink-postgres

    environment:
      POSTGRES_DB: heurislink
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d heurislink"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - heurislink-network


  redis:
    image: redis:8-alpine
    container_name: heurislink-redis

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - heurislink-network


  kafka:
    image: apache/kafka:4.3.1
    container_name: heurislink-kafka
    hostname: kafka

    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c '</dev/tcp/127.0.0.1/9092'"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      heurislink-network:
        aliases:
          - kafka


  heurislink:
    build:
      context: .
      dockerfile: Dockerfile

    expose:
      - "8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/heurislink
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}

      REDIS_HOST: redis
      REDIS_PORT: "6379"

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      APP_BASE_URL: http://localhost:8080

      APP_RATELIMIT_MAXREQUESTS: "10"
      APP_RATELIMIT_WINDOWSECONDS: "60"

    networks:
      - heurislink-network


  nginx:
    image: nginx:alpine
    container_name: heurislink-nginx

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - heurislink

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - heurislink-network


volumes:
  postgres-data:


networks:
  heurislink-network:
    driver: bridge
