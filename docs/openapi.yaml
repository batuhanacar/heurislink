openapi: 3.0.3
info:
  title: Heurislink API
  version: 1.0.0
  description: REST API for creating, redirecting, and managing short URLs.
  license:
    name: Proprietary
security: []
servers:
  - url: http://localhost:8080
    description: Local Docker Compose endpoint
tags:
  - name: Short URLs
    description: URL lifecycle and analytics operations.
  - name: Redirect
    description: Public short-link redirect operation.
paths:
  /urls:
    post:
      tags: [Short URLs]
      summary: Create a short URL
      operationId: createShortUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShortUrlRequest'
            example:
              originalUrl: https://example.com/docs
              expiresAt: null
      responses:
        '201':
          description: Short URL created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateShortUrlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /{shortCode}:
    get:
      tags: [Redirect]
      summary: Redirect to the original URL
      operationId: redirectShortUrl
      parameters:
        - $ref: '#/components/parameters/ShortCode'
      responses:
        '302':
          description: Redirect to the original URL
          headers:
            Location:
              description: Original URL
              schema:
                type: string
                format: uri
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
  /urls/{shortCode}/analytics:
    get:
      tags: [Short URLs]
      summary: Get click analytics
      operationId: getShortUrlAnalytics
      parameters:
        - $ref: '#/components/parameters/ShortCode'
      responses:
        '200':
          description: Analytics returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortUrlAnalyticsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
  /urls/{shortCode}:
    patch:
      tags: [Short URLs]
      summary: Update a short URL
      operationId: updateShortUrl
      parameters:
        - $ref: '#/components/parameters/ShortCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShortUrlRequest'
      responses:
        '200':
          description: Short URL updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateShortUrlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Short URLs]
      summary: Delete a short URL
      operationId: deleteShortUrl
      parameters:
        - $ref: '#/components/parameters/ShortCode'
      responses:
        '204':
          description: Short URL deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /urls/{shortCode}/activate:
    patch:
      tags: [Short URLs]
      summary: Activate a short URL
      operationId: activateShortUrl
      parameters:
        - $ref: '#/components/parameters/ShortCode'
      responses:
        '200':
          description: Activation state updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /urls/{shortCode}/deactivate:
    patch:
      tags: [Short URLs]
      summary: Deactivate a short URL
      operationId: deactivateShortUrl
      parameters:
        - $ref: '#/components/parameters/ShortCode'
      responses:
        '200':
          description: Activation state updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    ShortCode:
      name: shortCode
      in: path
      required: true
      description: Ten-character generated short URL code
      schema:
        type: string
        minLength: 1
        maxLength: 10
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Short URL does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: Short URL is inactive or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Create rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateShortUrlRequest:
      type: object
      required: [originalUrl]
      properties:
        originalUrl:
          type: string
          format: uri
          pattern: '^https?://.*$'
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Optional expiration time; must be in the future.
    UpdateShortUrlRequest:
      type: object
      properties:
        originalUrl:
          type: string
          format: uri
          pattern: '^https?://.*$'
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Optional new expiration time; must be in the future when supplied.
    CreateShortUrlResponse:
      type: object
      required: [id, originalUrl, shortCode, shortUrl, createdAt, active]
      properties:
        id: { type: string, format: uuid }
        originalUrl: { type: string, format: uri }
        shortCode: { type: string }
        shortUrl: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        active: { type: boolean }
    UpdateShortUrlResponse:
      type: object
      required: [id, originalUrl, shortCode, active]
      properties:
        id: { type: string, format: uuid }
        originalUrl: { type: string, format: uri }
        shortCode: { type: string }
        expiresAt: { type: string, format: date-time, nullable: true }
        active: { type: boolean }
    StatusResponse:
      type: object
      required: [id, shortCode, active]
      properties:
        id: { type: string, format: uuid }
        shortCode: { type: string }
        active: { type: boolean }
    ShortUrlAnalyticsResponse:
      type: object
      required: [id, originalUrl, shortCode, clickCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        originalUrl: { type: string, format: uri }
        shortCode: { type: string }
        clickCount: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [status, error, message, timestamp]
      properties:
        status: { type: integer, format: int32 }
        error: { type: string }
        message: { type: string }
        timestamp: { type: string, format: date-time }
