name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t heurislink:ci .

  kubernetes-validation:
    name: Kubernetes Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Kubeconform
        run: |
          KUBECONFORM_VERSION="0.7.0"

          curl -L \
            -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"

          tar -xzf kubeconform.tar.gz kubeconform

          sudo install \
            -m 0755 \
            kubeconform \
            /usr/local/bin/kubeconform

          kubeconform -v

      - name: Validate Kubernetes manifests
        run: |
          kubeconform \
            -strict \
            -summary \
            k8s/namespace.yaml \
            k8s/configmap.yaml \
            k8s/postgres.yaml \
            k8s/redis.yaml \
            k8s/kafka.yaml \
            k8s/heurislink.yaml \
            k8s/ingress.yaml \
            k8s/prometheus.yaml \
            k8s/grafana.yaml \
            k8s/grafana-dashboard.yaml

  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: kubernetes-validation

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set image name
        id: image
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/heurislink"
          echo "name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Verify published image
        run: |
          docker pull "${{ steps.image.outputs.name }}:${{ github.sha }}"
          docker image inspect "${{ steps.image.outputs.name }}:${{ github.sha }}"