apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: heurislink
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: kafka

  template:
    metadata:
      labels:
        app: kafka

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: kafka
              containerPort: 9092

            - name: controller
              containerPort: 9093

          env:
            - name: KAFKA_NODE_ID
              value: "1"

            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"

            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"

            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"

            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"

            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"

            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"

            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"

            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"

            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"

            - name: KAFKA_NUM_PARTITIONS
              value: "1"

            - name: KAFKA_HEAP_OPTS
              value: "-Xms256m -Xmx512m"

          startupProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24

          readinessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: "1"

---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: heurislink
spec:
  type: ClusterIP

  selector:
    app: kafka

  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
