apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: heurislink

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: "heurislink"

        metrics_path: /actuator/prometheus

        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - heurislink

        relabel_configs:
          - source_labels:
              - __meta_kubernetes_namespace
            action: keep
            regex: heurislink

          - source_labels:
              - __meta_kubernetes_pod_label_app
            action: keep
            regex: heurislink

          - source_labels:
              - __meta_kubernetes_pod_container_port_name
            action: keep
            regex: http

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: heurislink

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: heurislink

rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: heurislink

subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: heurislink

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: heurislink

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: prometheus

  template:
    metadata:
      labels:
        app: prometheus

    spec:
      serviceAccountName: prometheus

      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch

      containers:
        - name: prometheus
          image: prom/prometheus:latest
          imagePullPolicy: IfNotPresent

          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus

          ports:
            - name: http
              containerPort: 9090

          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 10
            failureThreshold: 6

          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m

          volumeMounts:
            - name: config
              mountPath: /etc/prometheus

            - name: prometheus-data
              mountPath: /prometheus

      volumes:
        - name: config
          configMap:
            name: prometheus-config

        - name: prometheus-data
          persistentVolumeClaim:
            claimName: prometheus-data

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: heurislink

spec:
  type: ClusterIP

  selector:
    app: prometheus

  ports:
    - name: http
      port: 9090
      targetPort: http