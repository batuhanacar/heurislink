apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: heurislink
  namespace: heurislink

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: heurislink

  minReplicas: 3
  maxReplicas: 6

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0

      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

        - type: Percent
          value: 100
          periodSeconds: 60

      selectPolicy: Max

    scaleDown:
      stabilizationWindowSeconds: 300

      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

      selectPolicy: Max
