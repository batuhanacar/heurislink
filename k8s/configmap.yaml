apiVersion: v1
kind: ConfigMap
metadata:
  name: heurislink-config
  namespace: heurislink
data:
  DB_URL: "jdbc:postgresql://postgres:5432/heurislink"


  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://tempo:4318/v1/traces"

  APP_BASE_URL: "https://your-domain.example"

  APP_RATELIMIT_MAXREQUESTS: "10"
  APP_RATELIMIT_WINDOWSECONDS: "60"

  POSTGRES_DB: "heurislink"
