apiVersion: apps/v1
kind: Deployment
metadata:
  name: heurislink
  namespace: heurislink
spec:
  replicas: 3

  progressDeadlineSeconds: 300

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: heurislink

  template:
    metadata:
      labels:
        app: heurislink

    spec:
      terminationGracePeriodSeconds: 40

      containers:
        - name: heurislink
          image: heurislink:0.1.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: heurislink-config

          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: heurislink-db-secret
                  key: username

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: heurislink-db-secret
                  key: password

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 768Mi
              cpu: 500m

---
apiVersion: v1
kind: Service
metadata:
  name: heurislink
  namespace: heurislink
spec:
  type: ClusterIP

  selector:
    app: heurislink

  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
